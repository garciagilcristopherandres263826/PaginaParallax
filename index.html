<!DOCTYPE html>
<html lang="es">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax</title>
    <style>
        body {
            margin: 0;
            background-color: #f3f3f3;
        }
 
        img {
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
 
        #parallax-container {
            position: relative;
            height: 100vh;
            /* Ocupa el 100% de la altura de la ventana */
            overflow: hidden;
            /* Oculta el desbordamiento */
        }
 
        #layer1 {
            /*Debe de tenerlo cada imagen*/position: absolute;
            z-index: 1;
            /* El más bajo el del fondo*/
            background-image: url('Img/Garden.webp');
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
 
       
        #layer2 {
            position: absolute;
            /*Debe de tenerlo cada imagen para ver el órden de las capas*/z-index: 3;
            /* Medio */
            top: 0;
            margin-top: 300px;
            left: 0;
            width: 100%;
            height: 100%;
        }
 
       
        #layer3 {
            position: absolute;
            /* El más alto */
            z-index: 4;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
 
       
        #layer4 {
            position: absolute;
            z-index: 5;
            /* El más alto */
            margin-top: -150px;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #layer5 {
            position: absolute;
            /* El más bajo */
            z-index: 6;
            margin-top: 500px;
            top: 100px;
            left: 0;
            width: 100%;
            height: 100%;
        }
 
        .completo {
            width: 100%;
            height: 50%;
        }
 
        /* --- Contenido (Debajo del Parallax) --- */
        .contenido {
            padding: 50px 20px;
            background-color: #2c6829;
            text-align: center;
            min-height: 1000px;
        }
    </style>
</head>
 
<body>
 
    <div id="parallax-container">
 
        <div id="layer1"></div>
 
        <div id="layer2">
            <img src="Img/Magearna_Original_Forme.webp">
        </div>
 
        <div id="layer3">
            <img class="completo" src="Img/8ac13583852c88b4490f2cc6f56d65aa.png">
        </div>
 
        <div id="layer4">
            <img class="completo" src="Img/gold-frame-page-divider-free-png.webp">
        </div>

        <div id="layer5">
            <img class="completo" src="Img/botanical-leaf-and-flower-watercolor-frame-border-png.png">
        </div>
 
    </div>
 
    <section class="contenido">
       
    </section>
 
    <script>
       
        document.addEventListener('DOMContentLoaded', function () {
           
            const container = document.getElementById('parallax-container');
            const layer1 = document.getElementById('layer1');
            const layer2 = document.getElementById('layer2');
            const layer3 = document.getElementById('layer3');
            const layer4 = document.getElementById('layer4');
            const layer5 = document.getElementById('layer5');
 
            //Definimos las velocidades de desplazamiento
            const speed1 = -0.1; // El fondo se mueve más rápido
            const speed2 = 0.2;
            const speed3 = -0.8; // El frente se mueve más lento
            const speed4 = -0.8; // El frente se mueve más lento
            const speed5 = 0.2; // El frente se mueve más lento
 
             function updateParallax() {
                // Es para que obtengamos la posición de scroll del elemento contenedor (respecto al top de la ventana)
                const scrollOffset = container.getBoundingClientRect().top;
 
                // Multiplicamos el desplazamiento por la velocidad de cada capa
 
                layer1.style.transform = `translate3d(0, ${scrollOffset * speed1}px, 0)`;
 
                layer2.style.transform = `translate3d(0, ${scrollOffset * speed2}px, 0)`;
 
                layer3.style.transform = `translate3d(0, ${scrollOffset * speed3}px, 0)`;
 
                layer4.style.transform = `translate3d(0, ${scrollOffset * speed4}px, 0)`;

                layer5.style.transform = `translate3d(0, ${scrollOffset * speed5}px, 0)`;
 
            }
 
            //Agregamos el listener para el evento
           window.addEventListener('scroll', updateParallax);
 
           
            updateParallax();
        });
    </script>
</body>
 
</html>
